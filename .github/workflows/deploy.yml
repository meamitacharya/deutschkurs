name: Deploy site

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and deploy
        run: |
          unzip -o deutschkurs-deploy2.zip -d /tmp/d2 && cp -r /tmp/d2/deutschkurs-deploy2/. . && rm -rf deutschkurs-deploy2.zip /tmp/d2
          git config user.name "meamitacharya"
          git config user.email "meamitacharya@users.noreply.github.com"
          git add -A
          git commit -m "Update site: flashcards, audio, fluency drill"
          git push
