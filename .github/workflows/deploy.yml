name: Deploy site from zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and deploy site
        run: |
          unzip -o deutschkurs-deploy.zip -d /tmp/deploy
          cp -r /tmp/deploy/deutschkurs-deploy/. .
          rm -rf deutschkurs-deploy.zip /tmp/deploy
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Deploy Deutschkurs site"
          git push
